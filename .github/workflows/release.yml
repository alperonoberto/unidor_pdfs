name: Build and Release Executables

on:
  push:
    tags:
      - 'v*' # Se activa al subir un tag que empiece por 'v' (ej. v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_path: dist/unir_pdfs.exe
          - os: ubuntu-latest
            asset_path: dist/unir_pdfs

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Instalación de dependencias compatible con Windows (PowerShell) y Linux (Bash)
    - name: Install dependencies (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        pip install pyinstaller

    - name: Install dependencies (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        pyinstaller --noconfirm --onefile --windowed unir_pdfs.py

    - name: Build with PyInstaller (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        pyinstaller --noconfirm --onefile unir_pdfs.py

    # Subimos el binario generado como artefacto temporal
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: executable-${{ matrix.os }}
        path: ${{ matrix.asset_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Descargamos los artefactos de ambos sistemas operativos
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: executable-windows-latest
        path: dist

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: executable-ubuntu-latest
        path: dist

    - name: List files for debugging
      run: ls -R dist

    - name: Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.exe
          dist/unir_pdfs
