name: Build and Release Executables

on:
  release:
    types: [published]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_path: dist/unir_pdfs.exe
          - os: ubuntu-latest
            asset_path: dist/unir_pdfs

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set application version
      run: python -c "from pathlib import Path; import os; Path('src/unidor_pdfs/app_version.py').write_text('APP_VERSION = ' + repr(os.environ['RELEASE_VERSION']) + '\n')"

    # Instalación de dependencias (Windows)
    - name: Install dependencies (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        pip install pyinstaller

    # Instalación de dependencias (Linux)
    - name: Install dependencies (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
        pip install pyinstaller

    # Build con PyInstaller para Windows
    - name: Build with PyInstaller (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        pyinstaller --noconfirm --onefile --windowed --paths src --icon=assets/logo_ico.ico --add-data "assets;assets" --collect-all pymupdf src/unidor_pdfs/unir_pdfs.py

    # Build con PyInstaller para Linux
    - name: Build with PyInstaller (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        pyinstaller --noconfirm --onefile --windowed --paths src --add-data "assets:assets" --collect-all pymupdf src/unidor_pdfs/unir_pdfs.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: executable-${{ matrix.os }}
        path: ${{ matrix.asset_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: executable-windows-latest
        path: dist-windows

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: executable-ubuntu-latest
        path: dist-linux

    # NUEVO: Renombramos los archivos para diferenciarlos claramente en el release
    - name: Rename binaries for release
      run: |
        mkdir -p release-assets
        # Copia y renombra el de Windows
        mv dist-windows/unir_pdfs.exe release-assets/unir_pdfs-windows-amd64.exe
        # Copia y renombra el de Linux
        mv dist-linux/unir_pdfs release-assets/unir_pdfs-linux-amd64
        ls -R release-assets

    - name: Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/*
